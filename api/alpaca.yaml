name: alpaca
base_url: https://paper-api.alpaca.markets/v2
auth:
  type: header
  key_name: APCA-API-KEY-ID
  value_template: "{{ALPACA_API_KEY}}"
extra_headers:
  APCA-API-SECRET-KEY: "{{ALPACA_SECRET}}"

endpoints:
  get_account:
    path: /account
    method: GET
    description: "Get detailed account information including buying power and equity."

  list_positions:
    path: /positions
    method: GET
    description: "List all open positions in the portfolio."

  get_asset:
    path: /assets/{{symbol}}
    method: GET
    description: "Get details for a specific asset (e.g. BTC/USD or AAPL)."

  place_order:
    path: /orders
    method: POST
    body:
      symbol: "{{symbol}}"
      qty: "{{qty}}"
      side: "{{side}}" # buy or sell
      type: "market"
      time_in_force: "gtc"
    description: "Place a market order for a specific symbol."
